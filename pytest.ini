[pytest]
# Suite de pruebas de CimX. Correr desde la raíz del proyecto:
#     pytest
# El sys.path hacia python/ y el backend Agg de matplotlib los configura
# tests/conftest.py. Si no tienes pytest, usa: python tests/run_all.py
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q
